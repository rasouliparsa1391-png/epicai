<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EpicAI.ir | هوش مصنوعی</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at 15% 15%,rgba(0,174,255,.25),transparent 30%),
radial-gradient(circle at 85% 85%,rgba(0,92,255,.22),transparent 32%),
linear-gradient(135deg,#eef8ff,#fff);
color:#102a43;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.app{
width:min(100%,980px);
height:min(900px,92vh);
min-height:560px;
display:flex;
flex-direction:column;
overflow:hidden;
border:1px solid rgba(255,255,255,.9);
border-radius:28px;
background:rgba(255,255,255,.82);
box-shadow:0 25px 80px rgba(0,90,190,.20);
backdrop-filter:blur(20px)
}

.header{
min-height:82px;
padding:14px 24px;
display:flex;
align-items:center;
justify-content:space-between;
color:#fff;
background:linear-gradient(135deg,#006eff,#00b8ff)
}

.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
width:50px;height:50px;display:grid;place-items:center;
border-radius:16px;background:#fff;color:#0878ff;
font-weight:900;font-size:19px;box-shadow:0 7px 22px rgba(0,0,0,.16)
}
.brand h1{font-size:21px;margin-bottom:4px}
.brand p{font-size:11px;opacity:.9}
.dot{
display:inline-block;width:8px;height:8px;margin-left:5px;
border-radius:50%;background:#7cffb2;box-shadow:0 0 12px #7cffb2
}
.header-actions{display:flex;align-items:center;gap:10px}
.image-mode-btn{
border:0;border-radius:12px;padding:9px 12px;cursor:pointer;
background:rgba(255,255,255,.18);color:#fff;font-family:inherit;
font-size:12px;font-weight:700
}
.image-mode-btn:hover{background:rgba(255,255,255,.28)}
.header-star{font-size:25px}
.user-info{font-size:12px;opacity:.95}
.logout{
border:0;border-radius:10px;padding:8px 12px;
cursor:pointer;background:rgba(255,255,255,.18);color:#fff
}

.authBox{
padding:20px;text-align:center;background:#fff;border-radius:20px;
margin:15px;box-shadow:0 5px 20px #ddd
}
.authBox h2{margin-bottom:10px}
.authInput{
padding:12px;width:90%;margin:5px;border-radius:10px;
border:1px solid #ddd;outline:none
}
.authBtn{
padding:10px 20px;margin:5px;border-radius:10px;border:0;
cursor:pointer
}
.registerBtn{background:#e8f4ff;color:#0878ff}
.loginBtn{background:#0878ff;color:#fff}
#authMessage{margin-top:8px;font-size:13px}

.chat{
flex:1;overflow-y:auto;padding:28px
}
.chat::-webkit-scrollbar{width:7px}
.chat::-webkit-scrollbar-thumb{border-radius:20px;background:#7bbcff}

.message{
display:flex;align-items:flex-start;gap:10px;margin-bottom:22px;
animation:show .25s ease
}
@keyframes show{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}
.avatar{
width:43px;height:43px;min-width:43px;display:grid;
place-items:center;border-radius:14px;font-size:19px
}
.ai-avatar{color:#fff;background:linear-gradient(135deg,#006eff,#00b8ff)}
.user-avatar{color:#0878ff;background:#e4f3ff}

.bubble{
max-width:75%;padding:14px 18px;border-radius:18px;
line-height:1.9;font-size:15px;overflow-wrap:anywhere
}
.ai-message .bubble{
background:#fff;border:1px solid #e2efff;
border-top-right-radius:5px;box-shadow:0 6px 22px rgba(0,100,200,.07)
}
.user-message{direction:ltr}
.user-message .bubble{
direction:rtl;color:#fff;background:linear-gradient(135deg,#006eff,#009fe8);
border-top-left-radius:5px;box-shadow:0 8px 22px rgba(0,110,255,.18)
}

.input-area{
padding:17px 22px 13px;border-top:1px solid #e2efff;
background:rgba(255,255,255,.92)
}
.input-box{
display:flex;align-items:flex-end;gap:10px;padding:7px 8px 7px 12px;
background:#fff;border:2px solid #dcecff;border-radius:19px;transition:.25s
}
.input-box:focus-within{
border-color:#008cff;box-shadow:0 0 0 4px rgba(0,140,255,.09)
}
textarea{
flex:1;min-height:44px;max-height:110px;resize:none;border:0;
outline:0;background:transparent;color:#102a43;
font:15px Tahoma,Arial,sans-serif;line-height:1.7;padding:9px
}
textarea::placeholder{color:#9ab0c5}
.send{
width:50px;height:50px;border:0;border-radius:15px;cursor:pointer;
color:#fff;background:linear-gradient(135deg,#006eff,#00b8ff);
font-size:21px;transition:.2s
}
.send:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,110,255,.30)}
.footer{margin-top:7px;text-align:center;color:#8ba4bb;font-size:10px}

.image-panel{
padding:12px 0 4px;
}
.image-box{
display:flex;align-items:flex-end;gap:10px;padding:7px 8px 7px 12px;
background:#fff;border:2px solid #dcecff;border-radius:19px;
}
.image-box textarea{
min-height:44px;max-height:110px;
}
.generate-image-btn{
width:52px;height:50px;border:0;border-radius:15px;cursor:pointer;
color:#fff;background:linear-gradient(135deg,#7b2cff,#d13cff);
font-size:20px;transition:.2s
}
.generate-image-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(123,44,255,.25)
}
.mode-switch{
display:flex;gap:8px;margin-bottom:8px
}
.mode-btn{
border:1px solid #dcecff;background:#fff;color:#58728b;
border-radius:10px;padding:7px 12px;cursor:pointer;font-family:inherit;
}
.mode-btn.active{
background:#0878ff;color:#fff;border-color:#0878ff;
}
.generated-image{
display:block;max-width:100%;border-radius:16px;margin-top:10px;
box-shadow:0 8px 30px rgba(0,80,180,.15)
}
.image-caption{
font-size:13px;color:#55718b;margin-top:8px
}

.hidden{display:none!important}

@media(max-width:650px){
body{padding:0}
.app{width:100%;height:100vh;min-height:0;border-radius:0}
.header{min-height:70px;padding:10px 15px}
.brand-icon{width:43px;height:43px}
.brand h1{font-size:18px}
.chat{padding:18px 12px}
.bubble{max-width:84%;font-size:14px}
.input-area{padding:10px}
.user-info{display:none}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
<div class="brand">
<div class="brand-icon">AI</div>
<div>
<h1>EpicAI.ir</h1>
<p><span class="dot"></span>هوش مصنوعی آنلاین</p>
</div>
</div>

<div class="header-actions">
<span class="user-info" id="userInfo"></span>
<button class="logout hidden" id="logoutBtn">خروج</button>
<button class="image-mode-btn" id="headerImageBtn" type="button">🎨 تصویر</button>
<div class="header-star">✨</div>
</div>
</header>


<div id="authBox" class="authBox">

<h2>🔐 ورود به EpicAI</h2>

<input id="email" class="authInput" type="email" placeholder="ایمیل">

<br>

<input id="password" class="authInput" type="password" placeholder="رمز عبور">

<br>

<button id="registerBtn" class="authBtn registerBtn">ثبت نام</button>
<button id="loginBtn" class="authBtn loginBtn">ورود</button>

<p id="authMessage"></p>

</div>


<main class="chat" id="chat">
<div class="message ai-message">
<div class="avatar ai-avatar">🤖</div>
<div class="bubble">
سلام! 👋<br>
به <b>EpicAI.ir</b> خوش اومدی 🚀<br>
چه کاری می‌تونم برات انجام بدم؟
</div>
</div>
</main>


<section class="input-area">

<div class="mode-switch">
<button id="chatModeBtn" class="mode-btn active" type="button">💬 چت</button>
<button id="imageModeBtn" class="mode-btn" type="button">🎨 ساخت تصویر</button>
</div>

<div id="imagePanel" class="image-panel hidden">
<div class="image-box">
<textarea id="imagePrompt" rows="1" placeholder="توضیح تصویری که می‌خوای بسازم..."></textarea>
<button class="generate-image-btn" id="generateImageBtn" type="button">🎨</button>
</div>
<div class="footer">ساخت تصویر با FLUX • EpicAI.ir</div>
</div>

<div id="chatInputBox" class="input-box">
<textarea id="messageInput" rows="1" placeholder="پیامت رو برای EpicAI بنویس..."></textarea>
<button class="send" id="sendBtn" type="button">➤</button>
</div>
<div class="footer">EpicAI.ir • هوش مصنوعی</div>
</section>

</div>


<script>
const input=document.getElementById("messageInput");
const chat=document.getElementById("chat");
const sendBtn=document.getElementById("sendBtn");
const authBox=document.getElementById("authBox");
const authMessage=document.getElementById("authMessage");
const logoutBtn=document.getElementById("logoutBtn");
const userInfo=document.getElementById("userInfo");

function escapeHtml(text){
return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function addMessage(text,type){
const message=document.createElement("div");
message.className="message "+(type==="user"?"user-message":"ai-message");

message.innerHTML=`
<div class="avatar ${type==="user"?"user-avatar":"ai-avatar"}">
${type==="user"?"👤":"🤖"}
</div>
<div class="bubble">${escapeHtml(text).replace(/\n/g,"<br>")}</div>
`;

chat.appendChild(message);
chat.scrollTop=chat.scrollHeight;
}

function clearChat(){
chat.innerHTML="";
}

async function loadHistory(){
try{
const res=await fetch("/history",{credentials:"include"});
if(!res.ok)return;

const data=await res.json();

if(data.success && data.messages.length){
clearChat();

data.messages.forEach(msg=>{
addMessage(msg.content,msg.role==="user"?"user":"ai");
});
}
}catch(e){
console.error("History Error:",e);
}
}


const imagePrompt=document.getElementById("imagePrompt");
const imageModeBtn=document.getElementById("imageModeBtn");
const chatModeBtn=document.getElementById("chatModeBtn");
const imagePanel=document.getElementById("imagePanel");
const chatInputBox=document.getElementById("chatInputBox");
const generateImageBtn=document.getElementById("generateImageBtn");
const headerImageBtn=document.getElementById("headerImageBtn");

function setMode(mode){
if(mode==="image"){
imagePanel.classList.remove("hidden");
chatInputBox.classList.add("hidden");
imageModeBtn.classList.add("active");
chatModeBtn.classList.remove("active");
imagePrompt.focus();
}else{
imagePanel.classList.add("hidden");
chatInputBox.classList.remove("hidden");
imageModeBtn.classList.remove("active");
chatModeBtn.classList.add("active");
input.focus();
}
}

function addGeneratedImage(imageUrl,prompt){
const message=document.createElement("div");
message.className="message ai-message";

message.innerHTML=`
<div class="avatar ai-avatar">🎨</div>
<div class="bubble">
<b>تصویر آماده شد! 🎉</b>
<div class="image-caption">${escapeHtml(prompt)}</div>
<img class="generated-image" src="${escapeHtml(imageUrl)}" alt="تصویر ساخته شده توسط EpicAI">
</div>
`;

chat.appendChild(message);
chat.scrollTop=chat.scrollHeight;
}

async function generateImage(){
const prompt=imagePrompt.value.trim();

if(!prompt)return;

addMessage("🎨 در حال ساخت تصویر... لطفاً کمی صبر کن.","ai");

const messages=chat.querySelectorAll(".message");
const loadingMessage=messages[messages.length-1];

generateImageBtn.disabled=true;

try{
const response=await fetch("/generate-image",{
method:"POST",
headers:{"Content-Type":"application/json"},
credentials:"include",
body:JSON.stringify({prompt})
});

const data=await response.json();

loadingMessage.remove();

if(!response.ok || !data.success){
throw new Error(data.message||"خطا در ساخت تصویر");
}

addGeneratedImage(data.image_url,prompt);
imagePrompt.value="";
imagePrompt.style.height="44px";

}catch(error){
console.error("Image Generation Error:",error);
loadingMessage.remove();
addMessage("❌ "+(error.message||"خطا در ساخت تصویر."),"ai");
}finally{
generateImageBtn.disabled=false;
}
}

async function checkLogin(){
try{
const res=await fetch("/me",{credentials:"include"});
const data=await res.json();

if(data.logged_in){
authBox.classList.add("hidden");
logoutBtn.classList.remove("hidden");
userInfo.textContent=data.user.email;
await loadHistory();
}else{
authBox.classList.remove("hidden");
logoutBtn.classList.add("hidden");
userInfo.textContent="";
}
}catch(e){
console.error("Login check error:",e);
}
}

async function register(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password){
authMessage.textContent="ایمیل و رمز عبور را وارد کنید.";
return;
}

try{
const res=await fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
credentials:"include",
body:JSON.stringify({email,password})
});

const data=await res.json();
authMessage.textContent=data.message;

if(data.success){
authBox.classList.add("hidden");
logoutBtn.classList.remove("hidden");
userInfo.textContent=data.user.email;
await loadHistory();
}
}catch(e){
authMessage.textContent="❌ خطا در ارتباط با سرور.";
}
}

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password){
authMessage.textContent="ایمیل و رمز عبور را وارد کنید.";
return;
}

try{
const res=await fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
credentials:"include",
body:JSON.stringify({email,password})
});

const data=await res.json();
authMessage.textContent=data.message;

if(data.success){
authBox.classList.add("hidden");
logoutBtn.classList.remove("hidden");
userInfo.textContent=data.user.email;
await loadHistory();
}
}catch(e){
authMessage.textContent="❌ خطا در ارتباط با سرور.";
}
}

async function logout(){
try{
await fetch("/logout",{
method:"POST",
credentials:"include"
});
}catch(e){}

clearChat();

chat.innerHTML=`
<div class="message ai-message">
<div class="avatar ai-avatar">🤖</div>
<div class="bubble">
سلام! 👋<br>
به <b>EpicAI.ir</b> خوش اومدی 🚀<br>
برای ادامه وارد حسابت شو.
</div>
</div>
`;

authBox.classList.remove("hidden");
logoutBtn.classList.add("hidden");
userInfo.textContent="";
}

async function sendMessage(){
const text=input.value.trim();
if(!text)return;

addMessage(text,"user");
input.value="";
input.style.height="44px";

addMessage("در حال فکر کردن... 🤖","ai");

const messages=chat.querySelectorAll(".message");
const loadingMessage=messages[messages.length-1];

try{
const response=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
credentials:"include",
body:JSON.stringify({message:text})
});

const data=await response.json();

loadingMessage.remove();

if(!response.ok){
throw new Error(data.reply||"خطا");
}

addMessage(data.reply||"پاسخی دریافت نشد.","ai");

}catch(error){
console.error("EpicAI Error:",error);
loadingMessage.remove();
addMessage("❌ "+(error.message||"خطا در ارتباط با هوش مصنوعی."),"ai");
}
}

document.getElementById("registerBtn").addEventListener("click",register);
document.getElementById("loginBtn").addEventListener("click",login);
logoutBtn.addEventListener("click",logout);
sendBtn.addEventListener("click",sendMessage);

imageModeBtn.addEventListener("click",()=>setMode("image"));
chatModeBtn.addEventListener("click",()=>setMode("chat"));
headerImageBtn.addEventListener("click",()=>setMode("image"));
generateImageBtn.addEventListener("click",generateImage);

imagePrompt.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
generateImage();
}
});

imagePrompt.addEventListener("input",()=>{
imagePrompt.style.height="auto";
imagePrompt.style.height=Math.min(imagePrompt.scrollHeight,110)+"px";
});

input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

input.addEventListener("input",()=>{
input.style.height="auto";
input.style.height=Math.min(input.scrollHeight,110)+"px";
});

checkLogin();
</script>

</body>
</html>
